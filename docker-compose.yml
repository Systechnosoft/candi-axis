version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: candiaxis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - candi-axis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./ca-api
      dockerfile: Dockerfile
    container_name: candiaxis-api
    ports:
      - "3000:3000"
    env_file:
      - ./ca-api/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - candi-axis-net
    restart: unless-stopped

  ui:
    build:
      context: ./ca-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: candiaxis-ui
    ports:
      - "3001:3001"
    env_file:
      - ./ca-ui/.env
    environment:
      - API_URL=http://api:3000
    depends_on:
      - api
    networks:
      - candi-axis-net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  candi-axis-net:
    driver: bridge
